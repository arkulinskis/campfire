<div class="cf-dialog cf-letgo">
  <div class="cf-dialog-head">
    <h2 class="cf-dialog-title">Let it go</h2>
    <anvil-component type="Button" name="close_button" prop:text="Close" prop:role='["btn", "btn-ghost", "btn-icon", "ic-x"]'></anvil-component>
  </div>

  <div class="cf-set-group">
    <label class="ui-field cf-paper-field"><span>Write what you want to leave in the fire</span>
      <anvil-component type="TextArea" name="note_box" prop:placeholder="A worry, a regret, something said today..."></anvil-component>
    </label>
    <div class="cf-say-row">
      <anvil-component type="Label" name="note_count" prop:role='["cf-set-hint"]' prop:text="It stays on this device. Nothing is saved or sent."></anvil-component>
      <anvil-component type="Button" name="burn_button" prop:text="Give it to the fire" prop:role='["btn", "btn-primary", "ic-flame"]'></anvil-component>
    </div>
    <p class="cf-set-hint">People have written things down and burned them for as long as there have been fires. Watch the
      paper catch, curl and go up with the smoke. Nobody else sees it, not even the others in your circle.</p>
  </div>
</div>

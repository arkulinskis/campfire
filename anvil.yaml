    <link rel="stylesheet" href="_/theme/app.css?v=788ee34930">
    <script src="_/theme/app-kit.js?v=12bffa8103"></script>
    <!-- the fire engine (three.js r158 + Campfire's own simulation, world, sound) -->
    <script src="_/theme/three.min.js?v=3bfa54fdd7"></script>
    <script src="_/theme/cf-core.js?v=3b18e9aa2b"></script>
    <script src="_/theme/cf-fire.js?v=8791711a76"></script>
    <script src="_/theme/cf-fx.js?v=df05e1b391"></script>
    <script src="_/theme/cf-world.js?v=939d96be42"></script>
    <script src="_/theme/cf-people.js?v=7c7babda7f"></script>
    <script src="_/theme/cf-audio.js?v=38e01f232e"></script>
    <script src="_/theme/cf-engine.js?v=a4472d6d8d"></script>

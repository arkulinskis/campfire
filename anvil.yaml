allow_embedding: false
db_schema:
  embers:
    client: none
    columns:
    - admin_ui:
        order: 0
        width: 200
      name: sid
      type: string
    - admin_ui:
        order: 1
        width: 200
      name: place
      type: string
    - admin_ui:
        order: 2
        width: 200
      name: seen
      type: datetime
    indexes: []
    server: full
    title: Embers
metadata:
  description: "A campfire simulated live: fluid-simulated flames, crackles made by chance, logs that char and fall in. Three campsites, a sleep timer, no sign-up."
  logo_img: "asset:icon-512.png"
  title: "Campfire: a real fire, simulated live in your browser"
name: Campfire
native_deps:
  head_html: |
    <script src="_/theme/legal-kit.js?v=b8c526f9be"></script>
    <!-- seo:start (APP_MAKER/seo: edit seo/apps/campfire.json and run seo.py, not here) -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
    <meta name="keywords" content="virtual campfire, campfire sounds, fireplace ambience, crackling fire sounds for sleep, realistic fire simulation, relaxing fire online, campfire white noise, webgl fire simulation, procedural fire sound, campfire screensaver">
    <meta name="author" content="Arkvital">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Campfire">
    <meta property="og:title" content="Campfire: a real fire, simulated live in your browser">
    <meta property="og:description" content="A campfire simulated live: fluid-simulated flames, crackles made by chance, logs that char and fall in. Three campsites, a sleep timer, no sign-up.">
    <meta property="og:locale" content="en_CA">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Campfire: a real fire, simulated live in your browser">
    <meta name="twitter:description" content="A campfire simulated live: fluid-simulated flames, crackles made by chance, logs that char and fall in. Three campsites, a sleep timer, no sign-up.">
    <!-- seo:end -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#07080a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=EB+Garamond:ital,wght@0,500;1,500&family=Spectral:ital,wght@0,500;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link id="ui-favicon" rel="icon" type="image/svg+xml" href="_/theme/icon.svg?v=2f56367534">
    <link rel="apple-touch-icon" href="_/theme/icon-180.png?v=094f7def20">
    <script>
    /* Keep our tab icon: Anvil adds its own <link rel="icon">, so drop any other icon link. */
    (function () {
      function keep() {
        var ours = document.getElementById('ui-favicon');
        if (!ours) return;
        document.querySelectorAll('link[rel~="icon"]').forEach(function (l) { if (l !== ours) l.remove(); });
      }
      keep();
      document.addEventListener('DOMContentLoaded', keep);
      window.addEventListener('load', keep);
    })();
    /* Tests open the app with ?cftest=1: the fire runs at its lightest (headless browsers draw WebGL on the CPU). */
    if (/[?&]cftest=1/.test(location.search)) window.CF_TEST = { quality: 'low' };
    /* The place picked last time sets the colours before the app draws (forest, snow, desert). */
    (function () {
      try { var p = JSON.parse(localStorage.getItem('campfire.place') || '"forest"'); document.documentElement.setAttribute('data-place', p || 'forest'); } catch (e) { document.documentElement.setAttribute('data-place', 'forest'); }
    })();
    </script>

    <!-- Prepsto feedback panel: every "Submit feedback" link and button opens it (it is the only feedback channel). No floating button, no cookies, nothing loads until it is opened. Codes: APP_MAKER/prepsto-links.json -->
    <script src="https://prepsto.com/_/theme/widget.js" data-prepsto="44beb5s" data-button="false" data-label="Submit feedback" async></script>
    <link rel="stylesheet" href="_/theme/icons.css?v=5d58495b18">
    <link rel="stylesheet" href="_/theme/app.css?v=9aad354f53">
    <script src="_/theme/app-kit.js?v=f84e977e24"></script>
    <!-- the fire engine (three.js r158 + Campfire's own simulation, world, sound) -->
    <script src="_/theme/three.min.js?v=3bfa54fdd7"></script>
    <script src="_/theme/cf-core.js?v=3b18e9aa2b"></script>
    <script src="_/theme/cf-fire.js?v=8791711a76"></script>
    <script src="_/theme/cf-fx.js?v=df05e1b391"></script>
    <script src="_/theme/cf-world.js?v=23c52d313f"></script>
    <script src="_/theme/cf-audio.js?v=38e01f232e"></script>
    <script src="_/theme/cf-engine.js?v=c72cd1da90"></script>
package_name: Campfire
runtime_options:
  client_version: '3'
  server_spec:
    base: python314
  version: 3
services:
- client_config:
    enable_v2: true
  server_config: {}
  source: /runtime/services/tables.yml
startup:
  module: startup
  type: module

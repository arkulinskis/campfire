    <link id="ui-favicon" rel="icon" type="image/svg+xml" href="_/theme/icon.svg?v=2f56367534">
    <link rel="apple-touch-icon" href="_/theme/icon-180.png?v=094f7def20">
    <script>
    /* Keep our tab icon: Anvil adds its own <link rel="icon">, so drop any other icon link. */
    (function () {
      function keep() {
        var ours = document.getElementById('ui-favicon');
        if (!ours) return;
        document.querySelectorAll('link[rel~="icon"]').forEach(function (l) { if (l !== ours) l.remove(); });
      }
      keep();
      document.addEventListener('DOMContentLoaded', keep);
      window.addEventListener('load', keep);
    })();
    /* Tests open the app with ?cftest=1: the fire runs at its lightest (headless browsers draw WebGL on the CPU). */
    if (/[?&]cftest=1/.test(location.search)) window.CF_TEST = { quality: 'low' };
    /* The place picked last time sets the colours before the app draws (forest, snow, desert). */
    (function () {
      try { var p = JSON.parse(localStorage.getItem('campfire.place') || '"forest"'); document.documentElement.setAttribute('data-place', p || 'forest'); } catch (e) { document.documentElement.setAttribute('data-place', 'forest'); }
    })();
    </script>

    <!-- Prepsto feedback panel: every "Submit feedback" link and button opens it (it is the only feedback channel). No floating button, no cookies, nothing loads until it is opened. Codes: APP_MAKER/prepsto-links.json -->
    <script src="https://prepsto.com/_/theme/widget.js" data-prepsto="44beb5s" data-button="false" data-label="Submit feedback" async></script>

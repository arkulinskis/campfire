    <noscript><div class="seo-noscript">
    <h1>Campfire: a real fire, simulated live in your browser</h1>
    <p>A campfire simulated live: fluid-simulated flames, crackles made by chance, logs that char and fall in. Three campsites, a sleep timer, no sign-up.</p>
    <p>Campfire is a campfire you can sit by in the browser. It isn&#x27;t a video or a loop: the flames are a fluid simulation of heat, wood gas, soot and air running on your graphics card, coloured by the physics of glowing soot, and they light the camp around them as they flicker.</p>
    <p>You strike a match, then tend the fire: put on pine, birch, maple and other woods, a damp branch that hisses before it catches, or stir the coals. Logs dry, catch, char and collapse into the coal bed, and an untended fire burns down over half an hour. Every crackle is made on the spot, so no two fires sound alike. Choose a boreal forest at midnight, a snowy lakeshore under a full moon, or a desert canyon.</p>
    <p>Who it's for: Anyone who wants to sit by a fire for a while: to relax, focus, or fall asleep</p>
    <h2>What it does</h2><ul><li>Flames from a live GPU fluid simulation, never a loop</li><li>Light and shadows driven by the flames themselves</li><li>Logs that dry, catch, char and fall in; nine woods with their own character</li><li>Crackles, hiss and roar synthesised live, panned to the wood they come from</li><li>Three campsites with their own night sounds: crickets and owls, singing lake ice and wolves, coyotes in a canyon</li><li>Sleep timer that lets the fire burn down, and an option to keep it going</li><li>Stir the coals, add a damp branch, walk around the fire</li><li>No sign-up, works on phones and computers</li></ul>
    <h2>Questions</h2><h3>Is it a video?</h3><p>No. Every flame, spark and sound is computed in your browser while you watch, so the fire is never the same twice.</p><h3>Can I fall asleep to it?</h3><p>Yes. Set the sleep timer to 20, 45 or 90 minutes: the fire burns down and the sound fades away.</p><h3>Does it work on a phone?</h3><p>Yes, on recent phones and tablets with WebGL 2. Headphones make the sound much better.</p><h3>Do I need an account?</h3><p>No. There are no accounts. Your settings are kept in your own browser.</p>
    <p><a href="https://campfire.anvil.app/about">About Campfire</a> &middot; <a href="https://campfire.anvil.app/llms.txt">Campfire for AI assistants</a> &middot; Made by <a href="https://arkvital.com">Arkvital</a>, Montreal, Canada. Campfire needs JavaScript in your browser.</p>
    </div></noscript>
    <!-- seo:end -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#07080a">

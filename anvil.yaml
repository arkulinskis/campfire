    <script type="application/ld+json">{"@context": "https://schema.org", "@graph": [{"@type": "Service", "@id": "https://campfire.anvil.app/#app", "name": "Campfire", "url": "https://campfire.anvil.app/", "description": "A campfire simulated live: fluid-simulated flames, crackles made by chance, logs that char and fall in. Three campsites, a sleep timer, no sign-up.", "image": "https://campfire.anvil.app/_/theme/og-image.png", "serviceType": "Sit by the fire. It has never burned this way before", "provider": {"@id": "https://arkvital.com/#org"}, "areaServed": "Worldwide", "availableChannel": {"@type": "ServiceChannel", "serviceUrl": "https://campfire.anvil.app/", "name": "Web browser", "availableLanguage": "en"}, "offers": {"@type": "Offer", "price": "0", "priceCurrency": "CAD"}, "audience": {"@type": "Audience", "audienceType": "Anyone who wants to sit by a fire for a while: to relax, focus, or fall asleep"}}, {"@type": "WebSite", "@id": "https://campfire.anvil.app/#site", "url": "https://campfire.anvil.app/", "name": "Campfire", "publisher": {"@id": "https://arkvital.com/#org"}}, {"@type": "Organization", "@id": "https://arkvital.com/#org", "name": "Arkvital", "url": "https://arkvital.com", "email": "arkvital@outlook.com", "address": {"@type": "PostalAddress", "addressLocality": "Montreal", "addressRegion": "QC", "addressCountry": "CA"}}]}</script>
